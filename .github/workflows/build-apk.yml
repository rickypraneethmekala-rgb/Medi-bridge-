name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java string: $JAVA_VER_OUTPUT"
          
          # Extract major version number
          if [[ "$JAVA_VER_OUTPUT" =~ \"([0-9]+)(\..*)?\" ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VER_OUTPUT" =~ version\ \"1\.([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not detect Java major version from output: $JAVA_VER_OUTPUT"
            exit 1
          fi
          
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_MAJOR) is lower than 17!"
            exit 1
          fi
          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary debug keystore!"
            exit 1
          fi
          echo "Temporary debug keystore created and verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at: $EXPECTED_APK"
            echo "Discovered APK files inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" || echo "No APK files found."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file is empty at: $EXPECTED_APK"
            exit 1
          fi
          
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::File does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi
          
          echo "APK verified successfully at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/medibridge-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="medibridge-app"
          fi
          
          # Sanitize repository name
          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | sed -e 's/[^a-zA-Z0-9._-]/-/g')
          RELEASE_ASSET_NAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at: $RELEASE_ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "release_asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "release_asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ] || [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "::error::Release asset validation failed for: $RELEASE_ASSET"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
          ### MediBridge Debug APK Build

          This is an automatically generated debug APK.
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: `${{ github.sha }}`
          - **Intended Use**: Testing & evaluation
          
          > ⚠️ **Note**: This APK is not a Play Store production release. It is signed with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$RELEASE_ASSET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest
            
          echo "tag_created=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.release_asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo " GitHub Release Published Successfully!   "
            echo "=========================================="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Asset Filename: $ASSET_NAME"
            
            RELEASE_URL=""
            if RELEASE_VIEW=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null); then
              RELEASE_URL="$RELEASE_VIEW"
              echo "Release Page URL: $RELEASE_URL"
            fi
            
            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Title**: Debug APK Build #${{ github.run_number }}"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Direct Download**: Download \`$ASSET_NAME\` from the **Assets** section of the release."
              if [ -n "$RELEASE_URL" ]; then
                echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)"
              fi
              echo ""
              echo "📦 The standard GitHub Actions artifact **\`app-debug-apk\`** is also retained as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo " ⚠️ GitHub Release Publishing Warning     "
            echo "=========================================="
            echo "Release publishing could not be completed, but the APK build succeeded!"
            echo "The debug APK artifact 'app-debug-apk' was uploaded and is ready for download."
            
            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Skipped/Failed)"
              echo ""
              echo "- **Build Status**: APK built and verified successfully."
              echo "- **Artifact Available**: The debug APK is safely preserved under the **\`app-debug-apk\`** Actions artifact."
              echo "- **Download Instructions**: Open the current workflow run page and download \`app-debug-apk\` from the Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
